
name: Linxi Frontend Build

on:
  push:
    branches:
      - linxi

permissions:
  contents: read

jobs:
  build:
    name: Build Vue Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout linxi code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: linxi-website
          path: dist/
          if-no-files-found: error
          retention-days: 14
